[workspace]
resolver = "3"
members = [
  "apps/studio/src-tauri",
  "apps/installer/src-tauri",
  "crates/hardware",
  "crates/catalog",
  "crates/fetch",
  "crates/core",
  "crates/provision",
  "crates/setup-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Stefan Cucoranu <elpideus@gmail.com>"]
repository = "https://github.com/elpideus/demido-studio"
rust-version = "1.88"

[workspace.dependencies]
demido-hardware = { path = "crates/hardware" }
demido-catalog = { path = "crates/catalog" }
demido-fetch = { path = "crates/fetch" }
demido-core = { path = "crates/core" }
demido-provision = { path = "crates/provision" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "charset", "query", "form"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
dirs = "6"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sysinfo = "0.39"
parking_lot = "0.12"
url = "2"
semver = "1"
minisign-verify = "0.2"
tempfile = "3"
walkdir = "2"
base64 = "0.22"
windows = "0.61"
windows-registry = "0.5"

tauri = { version = "2.11" }
tauri-build = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 1
