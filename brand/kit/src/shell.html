<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Demido Studio · Brand kit</title>
  <link rel="icon" href="../logo/favicon.svg" type="image/svg+xml">
  <script>
    /* Apply the saved theme before first paint. No saved choice = follow the system. */
    try {
      var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('demido-kit-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../css/demido.css">
  <link rel="stylesheet" href="css/kit.css">
  <!--SECTION_STYLES-->
</head>
<body class="kit">
  <a class="kit-skip" href="#main">Skip to content</a>

  <aside class="kit-side" aria-label="Brand kit">
    <a class="kit-brand" href="#top" aria-label="Demido Studio brand kit, top of page">
      <span class="kit-brand__mark"><!--@include logo/demido-symbol.svg--></span>
      <span class="kit-brand__text">
        <span class="kit-brand__name">Demido Studio</span>
        <span class="kit-brand__sub">Brand kit · 0.1 draft</span>
      </span>
    </a>

    <nav class="kit-nav" aria-label="Sections">
      <!--NAV-->
    </nav>

    <div class="kit-side__foot">
      <div class="kit-theme" role="radiogroup" aria-label="Theme">
        <button type="button" role="radio" aria-checked="false" data-theme-choice="dark">Dark</button>
        <button type="button" role="radio" aria-checked="false" data-theme-choice="light">Light</button>
        <button type="button" role="radio" aria-checked="true" data-theme-choice="system">System</button>
      </div>
    </div>
  </aside>

  <main class="kit-main" id="main">
    <span id="top"></span>
    <!--SECTIONS-->

    <footer class="kit-foot">
      <p>Demido Studio brand kit, draft 0.1. Sources: <code>brand/tokens/src</code>, <code>brand/css</code>, <code>brand/logo</code>, <code>brand/kit/src</code>. Rebuild with <code>node brand/build.mjs</code>.</p>
    </footer>
  </main>

  <div class="kit-toast" role="status" aria-live="polite" hidden></div>

  <script defer src="js/kit.js"></script>
  <!--SECTION_SCRIPTS-->
</body>
</html>
