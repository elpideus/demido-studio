[package]
name = "demido-provision"
description = "The installation engine: fetches the runtime, Python, Node, uv and a starter model, then registers the app."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
demido-core.workspace = true
demido-catalog.workspace = true
demido-fetch.workspace = true
demido-hardware.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
sysinfo.workspace = true
zip.workspace = true
chrono.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
] }

[dev-dependencies]
tempfile.workspace = true
