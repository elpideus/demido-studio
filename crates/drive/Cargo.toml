[package]
name = "demido-drive"
description = "Development only: lets scripts/drive.mjs drive the app and setup on Linux, where WebKitGTK has no DevTools protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
tauri.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
tracing.workspace = true
# WebKitGTK's own API, in the versions and features wry uses: the page's answers, its snapshots
# and its console.
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"
cairo-rs = { version = "0.18", features = ["png"] }
