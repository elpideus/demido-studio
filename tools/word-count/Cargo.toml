# A tool of Demido's own, made as a package to prove the format (DECISIONS C12): it counts the words, lines and
# characters of a file in the session's folder. Built with: cargo build --release --target wasm32-wasip2
[package]
name = "word-count"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen 0.57, Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT: the guest side of the interface.
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
