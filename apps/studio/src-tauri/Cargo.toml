[package]
name = "demido-studio"
description = "Demido Studio: an easy to use, powerful LLM harness."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "demido_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
demido-core.workspace = true
demido-catalog.workspace = true
demido-hardware.workspace = true
demido-fetch = { workspace = true, features = ["xet"] }
demido-extract.workspace = true

tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
regex.workspace = true
base64.workspace = true
url.workspace = true
walkdir.workspace = true
sha2.workspace = true
hex.workspace = true
semver.workspace = true
minisign-verify.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
notify-debouncer-full = "0.6"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
portable-pty = "0.9"
avt = "0.18"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
# Sending mail over SMTP, with the same TLS as IMAP: rustls on aws-lc-rs and the system's
# certificate verifier.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
tokio-rustls = "0.26"
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }
windows-registry.workspace = true
# The microphone permission (see `speech::microphone`): the same version wry uses.
webview2-com = "0.39"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK's own settings and permission requests (the microphone): the same version and
# features wry uses.
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# Driving the app from scripts/drive.mjs, in debug builds.
demido-drive.workspace = true

[dev-dependencies]
tempfile.workspace = true
