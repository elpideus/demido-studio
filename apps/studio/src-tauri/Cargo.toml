[package]
name = "demido-studio"
description = "Demido Studio: an easy to use, powerful LLM harness."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "demido_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
demido-core.workspace = true
demido-catalog.workspace = true
demido-hardware.workspace = true
demido-fetch.workspace = true
demido-extract.workspace = true

tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
regex.workspace = true
base64.workspace = true
url.workspace = true
walkdir.workspace = true
sha2.workspace = true
hex.workspace = true
semver.workspace = true
minisign-verify.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
notify-debouncer-full = "0.6"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
portable-pty = "0.9"
avt = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
