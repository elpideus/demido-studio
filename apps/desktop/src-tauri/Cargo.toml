[package]
name = "demido-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "Demido Studio's desktop shell: a window on the core it starts or joins, a tray, notices. No product logic (DECISIONS C1 to C3)."
publish = false

# Its own workspace: the core's never links GTK, WebKit or a window (C1).
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
