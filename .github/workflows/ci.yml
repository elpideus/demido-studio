name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every machine-checkable rule in docs/rules/, in one job: the design system
  # (#9), the brief (#12), and the repo hygiene rules from #16. It runs on Linux
  # because it reads files and git metadata and nothing else; the build job
  # below is the Windows one.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The attribution check reads commit metadata, so the range has to be
          # in the clone. A shallow checkout would hide exactly the commits
          # under review.
          fetch-depth: 0
          # On a pull request the default ref is a merge commit GitHub itself
          # authored, which is not a commit anyone wrote and would fail the
          # author check on every PR. Check out the branch tip instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Without this, an SSH signature is present but unverifiable, and the
      # check can only say "signed by something". With it, "signed by Stefan".
      - name: Trust the author's signing key
        run: git config gpg.ssh.allowedSignersFile .github/allowed_signers

      - name: Work out which commits this run is responsible for
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # A new branch, a force push, or the first push to an empty repo.
            # Falling back to the tip is the honest answer: the range does not
            # exist, and inventing a wide one would report old commits as new.
            range=""
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Check rules
        env:
          RULES_RANGE: ${{ steps.range.outputs.range }}
        run: node scripts/check-rules.mjs

  # The Rust workspace and the frontend, on the platform Demido ships on first
  # (Brief B03: "windows-only at first, during the pre-release versions"). The
  # gates here are the ones the pre-commit hook runs, so a session that
  # installed the hook has already seen every failure this job can report.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      # The frontend bundle rather than the installer. Bundling is a release
      # concern and has its own workflow and its own checker
      # (docs/rules/releases.md); what this job owes is that the code compiles.
      - name: Build
        run: |
          pnpm build:web
          cargo build --manifest-path src-tauri/Cargo.toml --workspace
