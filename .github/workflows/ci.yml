# Checks every change: the web UI builds, the core is tidy, and its tests pass on Linux, Windows and macOS.
#
# Actions are pinned to an exact commit (the version is in the comment beside it). Versions and runner
# names were read from their official sources on 2026-11-21.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch: for work that only the checks' Mac and Windows machines can try.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (takes the pnpm version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The brand kit matches its sources
        run: |
          pnpm brand:build
          if ! git diff --exit-code -- brand; then
            echo "::error::The built brand files differ from their sources. Run 'pnpm brand:build' and commit the result."
            exit 1
          fi
      - name: Types
        run: pnpm app:typecheck
      - name: Build
        run: pnpm app:build

  licences:
    name: Licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - name: Every dependency's licence fits GPL-3.0-or-later
        run: node scripts/check-licences.mjs

  core:
    name: Core (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04, tidy: true }
          - { name: Windows, runner: windows-2025, tidy: false }
          - { name: macOS, runner: macos-15, tidy: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: Formatting
        if: matrix.tidy
        run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - name: Lints
        if: matrix.tidy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
      - name: A sandbox, so that the sandbox is tested (Linux)
        if: runner.os == 'Linux'
        # bubblewrap is what Demido shuts a program in. Ubuntu 24.04 does not let ordinary programs make the
        # namespaces it needs unless told to; a person's own computer is asked the same once, by the installer.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          echo "DEMIDO_EXPECT_SANDBOX=1" >> "$GITHUB_ENV"
      - name: A sandbox, so that the sandbox is tested (macOS)
        if: runner.os == 'macOS'
        # Seatbelt is part of macOS: there is nothing to install. Its absence is a failure here.
        run: |
          ls -l /usr/bin/sandbox-exec
          sw_vers
          echo "DEMIDO_EXPECT_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --manifest-path core/Cargo.toml --locked
      - name: It runs and reads this computer
        run: cargo run --manifest-path core/Cargo.toml --locked -- system
