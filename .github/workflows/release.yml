# Publishes a release when a v* tag is pushed (`pnpm release <version>` pushes one): the checks
# from ci.yml, the installer built on Windows and signed by a job of its own, then a GitHub release
# carrying the installer and its signature, which is what the app's updater downloads and
# verifies. A tag with a "-" (v0.5.0-beta.1) is published as a pre-release.
#
# Run by hand (Actions, Release, Run workflow), it builds the installer from the chosen ref and
# keeps it as a workflow artifact, unsigned, publishing nothing: a build to test. The signing key
# is for releases only.
#
# Every action is pinned to a commit, with its tag in a comment: a tag can be moved to other code,
# a commit cannot.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, and never cancelled halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is published only once CI's checks pass on it. A build by hand skips them: it publishes
  # nothing, and whoever starts it wants the installer soon.
  checks:
    name: Checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # The build never sees the signing key. It runs the build scripts of every dependency, and code
  # run in a job can leave things behind for the job's later steps (a changed tauri CLI in
  # node_modules, a directory added to the PATH, a process still running), so the key is used
  # on another runner, in the sign job.
  build:
    name: Build the installer
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node before pnpm, as in ci.yml: scripts/build-release.mjs runs pnpm.cmd.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      # The stable branch installs the latest stable Rust.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cache saved on a tag serves only that tag. A test build on main saves one the next
          # tag starts from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The tag matches the version in the repository
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/version.mjs --check "$GITHUB_REF_NAME"

      - name: Version
        id: version
        run: echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Print the checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum "release/Demido-Studio-Setup-$VERSION.exe" | tee -a "$GITHUB_STEP_SUMMARY"

      # The file keeps its name: the signature names the file it was made for, and the updater
      # checks that name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Demido-Studio-Setup-${{ steps.version.outputs.version }}-unsigned
          path: release/Demido-Studio-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          # Running the jobs again replaces the artifact instead of failing on it.
          overwrite: true

  # Signs the installer the build job made, on a fresh runner: nothing checked out, nothing
  # installed or restored from a cache, no token permissions, only the signer, pinned to the exact
  # tauri CLI version in pnpm-lock.yaml (scripts/workflows.test.mjs keeps the two equal) and run
  # from an empty directory. This keeps the key out of reach of code from the build. It does not
  # vouch for the installer: what the build made is signed as it is.
  #
  # The key and its password are secrets of the release environment, which only v* tags may use.
  sign:
    name: Sign the installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Only an installer whose commit passed the checks gets signed.
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment: release
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAURI_CLI_VERSION: 2.11.5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Demido-Studio-Setup-${{ needs.build.outputs.version }}-unsigned
          path: installer

      - name: Sign
        # The signer waits for a password on the console when it has none.
        timeout-minutes: 5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No install script of any package runs while the key is in the environment.
          npm_config_ignore_scripts: 'true'
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The release environment has no TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          fi
          setup="$GITHUB_WORKSPACE/installer/Demido-Studio-Setup-$VERSION.exe"
          # An empty directory, so no package.json or .npmrc around it has a say in what npx runs.
          cd "$(mktemp -d)"
          npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" signer sign --app-version "$VERSION" "$setup" < /dev/null

      - name: Check the signature
        run: |
          setup="installer/Demido-Studio-Setup-$VERSION.exe"
          if [ ! -s "$setup.sig" ]; then
            echo "::error::$setup.sig is missing or empty: the installer is not signed."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Demido-Studio-Setup-${{ needs.build.outputs.version }}
          path: |
            installer/Demido-Studio-Setup-${{ needs.build.outputs.version }}.exe
            installer/Demido-Studio-Setup-${{ needs.build.outputs.version }}.exe.sig
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish the release
    if: github.event_name == 'push'
    # build for its version; the files come from sign.
    needs: [checks, build, sign]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The whole history and every tag: the notes list the commits since the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Demido-Studio-Setup-${{ needs.build.outputs.version }}
          path: assets

      # Installed apps read releases without signing in: from a private repository they get 404.
      - name: The repository is public
        run: |
          visibility=$(gh repo view "$GH_REPO" --json visibility --jq .visibility)
          if [ "$visibility" != PUBLIC ]; then
            echo "::error::$GH_REPO is $visibility: installed apps could not read this release."
            exit 1
          fi

      - name: Release notes
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md

      - name: Publish
        run: |
          files=("assets/Demido-Studio-Setup-$VERSION.exe" "assets/Demido-Studio-Setup-$VERSION.exe.sig")
          # A pre-release is never marked as the latest release.
          if [[ "$TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: replace the files and the notes instead of failing.
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "Demido Studio $VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "Demido Studio $VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi
