# Demido Studio, the core: everything that is not a window.
# One library (demido-core) and one program (demido: the server and the command line).
[workspace]
resolver = "3"
members = ["crates/demido-core", "crates/demido"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

# Versions and licences were read from crates.io on 2026-11-21 (docs/research/11-core-architecture.md).
[workspace.dependencies]
demido-core = { path = "crates/demido-core" }
anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
nvml-wrapper = "0.13"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }
uuid = { version = "1.29", features = ["v4", "v7"] }

[profile.release]
lto = "thin"
strip = true
