# Demido Studio, the core: everything that is not a window.
# One library (demido-core) and one program (demido: the server and the command line).
[workspace]
resolver = "3"
members = ["crates/demido-core", "crates/demido"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

# Versions and licences were read from crates.io on 2026-11-21 (docs/research/11-core-architecture.md).
[workspace.dependencies]
demido-core = { path = "crates/demido-core" }
anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
# A web page turned into its readable text. Read from crates.io on 2026-11-21: 0.20.0, MIT (docs/research/15-search-and-fetch.md).
dom_smoothie = "0.20"
# Pages that are not written in UTF-8.
encoding_rs = "0.8"
flate2 = "1.1"
# The SHA-512 npm lists for a package is written in base64. 0.23, MIT OR Apache-2.0; already in the build through other crates.
base64 = "0.23"
# Dates and times with the system's own time zone. Read from crates.io on 2026-11-21: 1.0.1, Unlicense OR MIT.
jiff = "1"
# Where keys are kept: the system's own keyring, one crate per system. Read from crates.io on 2026-11-21:
# keyring-core 1.1.0, zbus-secret-service-keyring-store 1.0.1, apple-native-keyring-store 1.0.2,
# windows-native-keyring-store 1.1.0, all MIT OR Apache-2.0 (docs/research/05-security-injection.md, 18-keys-and-providers.md).
# The Secret Service is reached in Rust (zbus, with Rust's own crypto): no C library, no OpenSSL.
keyring-core = "1.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = { version = "1.1", default-features = false }
# Windows' own calls, for a job that holds everything a command starts (sandbox.rs). 0.61.2, MIT OR
# Apache-2.0; already in the build through tokio and others.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
nvml-wrapper = "0.13"
# rustls with the system's own list of trusted certificates. No OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "json", "system-proxy", "gzip", "brotli"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Line diffs of what a change changed. Read from crates.io on 2026-11-21: 3.2.1, Apache-2.0.
similar = "3"
sysinfo = "0.40"
tar = "0.4"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
utoipa = { version = "6", features = ["axum_extras"] }
uuid = { version = "1.29", features = ["v4", "v7"] }
# Only "deflate": what a .zip from llama.cpp's Windows releases uses. The other methods would pull in C libraries.
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
