# Demido Studio, the core: everything that is not a window.
# One library (demido-core) and one program (demido: the server and the command line).
[workspace]
resolver = "3"
members = ["crates/demido-core", "crates/demido"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

# Versions and licences were read from crates.io on 2026-11-21 (docs/research/11-core-architecture.md).
[workspace.dependencies]
demido-core = { path = "crates/demido-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
# A web page turned into its readable text. Read from crates.io on 2026-11-21: 0.20.0, MIT (docs/research/15-search-and-fetch.md).
dom_smoothie = "0.20"
# Pages that are not written in UTF-8.
encoding_rs = "0.8"
# The text of a PDF that read_page fetched (web/pdf.rs). pdf-extract 0.12, MIT, on lopdf (MIT). Read 2026-11-22.
pdf-extract = "0.12"
flate2 = "1.1"
# The SHA-512 npm lists for a package is written in base64. 0.23, MIT OR Apache-2.0; already in the build through other crates.
base64 = "0.23"
# Dates and times with the system's own time zone. Read from crates.io on 2026-11-21: 1.0.1, Unlicense OR MIT.
jiff = "1"
# Where keys are kept: the system's own keyring, one crate per system. Read from crates.io on 2026-11-21:
# keyring-core 1.1.0, zbus-secret-service-keyring-store 1.0.1, apple-native-keyring-store 1.0.2,
# windows-native-keyring-store 1.1.0, all MIT OR Apache-2.0 (docs/research/05-security-injection.md, 18-keys-and-providers.md).
# The Secret Service is reached in Rust (zbus, with Rust's own crypto): no C library, no OpenSSL.
keyring-core = "1.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = { version = "1.1", default-features = false }
# Windows' own calls, for a job that holds everything a command starts (sandbox.rs). 0.61.2, MIT OR
# Apache-2.0; already in the build through tokio and others.
# What a program in the sandbox may not ask of the kernel, compiled for bubblewrap (sandbox.rs). seccompiler
# 0.5.0, Apache-2.0 OR BSD-3-Clause (research note 14); libc 0.2, MIT OR Apache-2.0, already in the build.
seccompiler = "0.5"
# Sending a file of a session's folder as it is read (folder.rs). tokio-util 0.7, MIT; already in the build.
tokio-util = { version = "0.7", features = ["io"] }
# Voice (research notes 25 and 28; DECISIONS V7). sherpa-onnx 2.0.1, Apache-2.0, from k2-fsa: the speech detector,
# Parakeet and Pocket TTS. Its build downloads sherpa-onnx's own prebuilt static library from its GitHub release,
# with onnxruntime (MIT) inside it. ort 2.0.0-rc.15, MIT OR Apache-2.0, runs Smart Turn on that same onnxruntime:
# with `disable-linking` it links none of its own. rustfft 6.4.1, MIT OR Apache-2.0: Whisper's features for
# Smart Turn. Read from crates.io on 2026-11-22. Only the `demido` program links them, for `demido voice-engine`.
sherpa-onnx = "=2.0.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std"] }
ort-sys = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-17", "disable-linking"] }
rustfft = "6.4"
# Pocket TTS comes in a .tar.bz2 (its vocabulary is only in sherpa-onnx's package). bzip2 0.6.1, MIT OR
# Apache-2.0, on libbz2-rs-sys (bzip2-1.0.6 licence: BSD-style, like zlib's). Read from crates.io on 2026-11-22.
bzip2 = "0.6"
libc = "0.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Shell"] }
nvml-wrapper = "0.13"
# rustls with the system's own list of trusted certificates. No OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "json", "system-proxy", "gzip", "brotli"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Line diffs of what a change changed. Read from crates.io on 2026-11-21: 3.2.1, Apache-2.0.
similar = "3"
sysinfo = "0.40"
tar = "0.4"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
utoipa = { version = "6", features = ["axum_extras"] }
uuid = { version = "1.29", features = ["v4", "v7"] }
# Only "deflate": what a .zip from llama.cpp's Windows releases uses. The other methods would pull in C libraries.
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
