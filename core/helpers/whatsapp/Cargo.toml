# demido-whatsapp: WhatsApp as a linked device, for Demido's core (DECISIONS G20, research note 37).
# A workspace of its own: whatsapp-rust's store links an SQLite (libsqlite3-sys 0.37) that cannot sit beside the
# core's (rusqlite 0.43) in one program.
[package]
name = "demido-whatsapp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"
publish = false

[workspace]

[dependencies]
# whatsapp-rust 0.7.0, MIT, read from crates.io on 2026-11-26: a Rust port of whatsmeow. Its defaults: the SQLite
# store, Tokio's WebSocket, ureq for media, Tokio itself; not its `simd`, which needs a nightly compiler.
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
