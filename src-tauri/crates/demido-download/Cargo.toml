[package]
name = "demido-download"
description = "The download queue: a model's files onto disk, resumable, verified, and a failure that says what happened."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Where a download lands, what a repository's choice is made of, and the GGUF
# check a finished file passes before it is renamed into the library.
demido-models.workspace = true
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Free space on the download folder's volume, asked before a transfer starts.
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# The fake server resets a connection with a zero linger, which tokio's own
# socket no longer offers without a deprecation.
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
