[package]
name = "demido-chat"
description = "The session, the assembly it composes, and the turn loop that runs it."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
demido-core.workspace = true
# The seam a turn is sent through, and the supervisor that keeps one model
# resident. Nothing here knows what a backend is made of.
demido-inference.workspace = true
# What is in force for this conversation. The turn loop resolves the ladder
# rather than being handed values, so nothing above it can send a request the
# ladder did not decide.
demido-settings.workspace = true
# The source of truth. A transcript is a projection of this log, never a table
# beside it, which is the one thing that makes the log worth writing.
demido-trace.workspace = true
# The matrix a call is ruled on by. The loop hands it the mode and the call's
# intent and does what it says; it never reads the mode itself.
demido-permission.workspace = true
# What a refusal tells the model, and the words a tool is offered in.
demido-prompts.workspace = true
# The registry a call is dispatched through.
demido-tools.workspace = true
# What the card has free, and whether one more slot fits in it. A sub-agent is
# a second slot on the conversation's own weights, so parallelism is this
# crate's arithmetic rather than a preference the loop keeps.
demido-vram.workspace = true
# What a slot costs: the model in force's header, read at the load for the
# attention geometry a KV cache is sized from (#105).
demido-models.workspace = true
futures-util = "0.3"
serde.workspace = true
# A call's arguments, parsed, for the person deciding about them.
serde_json.workspace = true
thiserror.workspace = true
# `select!`, so a stop reaches a call waiting on a person or on a command, and
# `rt` for the header read at a load, which is file I/O and goes to a blocking
# thread rather than stalling the runtime.
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
# The live suite wraps `LlamaCpp` in a backend that records what it was handed,
# and `Backend` is an `async_trait`, so an implementation of it needs the same
# attribute. Only the tests implement one.
async-trait = "0.1"
# S3's live suite fetches the model it runs through the real queue, off the real
# index, and loads what the library then offers. Only that suite reaches for
# either: the turn loop is handed a model and never asks where it came from.
demido-download.workspace = true
demido-models.workspace = true
# A project on disk for the tools to act on.
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
